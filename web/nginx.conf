# Serves the built console and proxies both APIs on the same origin (no CORS).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # Hashed assets never change; index.html always revalidates so a deploy is picked up.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }

  # Host is the browser's: the sync service refuses admin POSTs whose Origin doesn't match it.
  proxy_set_header Host $http_host;
  # A 401 goes to the console's sign-in screen, not the browser's native prompt.
  proxy_hide_header WWW-Authenticate;

  location /api/sync/ {
    proxy_pass http://sync:3000/;
  }

  # The Internal System has no auth of its own, so only a signed-in operator reaches it through here.
  location /api/internal/ {
    auth_request /_auth;
    error_page 403 = @unauthorized;
    proxy_pass http://internal-system:3001/;
  }

  # ponytail: checks the admin password on every Internal System call (one small query set); cache it if that ever shows up.
  location = /_auth {
    internal;
    proxy_pass http://sync:3000/admin/api/status;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # A failed check comes back as 403 and then a bare 401: auth_request would pass on a 401's WWW-Authenticate.
    proxy_intercept_errors on;
    error_page 401 = @denied;
  }
  location @denied {
    return 403;
  }
  location @unauthorized {
    return 401;
  }
}
