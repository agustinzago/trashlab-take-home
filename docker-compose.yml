services:
  internal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: internal
      POSTGRES_PASSWORD: internal
      POSTGRES_DB: internal
    ports: ["${INTERNAL_DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "internal"]
      interval: 2s
      retries: 15

  internal-system:
    build: .
    command: ["node", "internal-system/src/main.ts"]
    environment:
      DATABASE_URL: postgres://internal:internal@internal-db:5432/internal
      PORT: "3001"
      WEBHOOK_URL: ${INTERNAL_WEBHOOK_URL:-http://sync:3000/webhooks/internal}
      WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-dev-internal-secret}
      CHAOS: ${CHAOS:-0}
    ports: ["${INTERNAL_PORT:-3001}:3001"]
    depends_on:
      internal-db: { condition: service_healthy }

  sync-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sync"]
      interval: 2s
      retries: 15

  # Stands in for QBO when no Intuit app is configured (QBO_CLIENT_ID empty): in-memory, sends signed webhooks.
  mock-qbo:
    build: .
    command: ["node", "mock-qbo/main.ts"]
    environment:
      PORT: "4000"
      WEBHOOK_URL: http://sync:3000/webhooks/qbo
      QBO_WEBHOOK_VERIFIER: ${QBO_WEBHOOK_VERIFIER:-dev-qbo-verifier}
    ports: ["${MOCK_QBO_PORT:-4000}:4000"]

  sync:
    build: .
    command: ["node", "sync/src/main.ts"]
    environment:
      DATABASE_URL: postgres://sync:sync@sync-db:5432/sync
      PORT: "3000"
      INTERNAL_URL: http://internal-system:3001
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-dev-internal-secret}
      # Empty QBO_CLIENT_ID: the mock QBO is used. Set it (and the secret) to use a real QBO sandbox.
      QBO_MOCK_URL: http://mock-qbo:4000
      QBO_BASE_URL: ${QBO_BASE_URL:-https://sandbox-quickbooks.api.intuit.com}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID:-}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET:-}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-http://localhost:3000/qbo/callback}
      QBO_WEBHOOK_VERIFIER: ${QBO_WEBHOOK_VERIFIER:-dev-qbo-verifier}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # The mock QBO creates Items Consulting=1 and Hosting=2 (in the sandbox, 1 is "Services").
      ACCOUNT_MAPPING: ${ACCOUNT_MAPPING:-{"revenue_category":{"consulting":"1","hosting":"2"}}}
    ports: ["${SYNC_PORT:-3000}:3000"]
    depends_on:
      sync-db: { condition: service_healthy }
      mock-qbo: { condition: service_started }

  web:
    build: ./web
    ports: ["${WEB_PORT:-8088}:8080"]
    depends_on: [sync, internal-system]
